name: CI / Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/gay_boy_packet_pro:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up QEMU (for cross build)
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./deploy/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/gay_boy_packet_pro:latest

    # Optional: Deploy to Heroku (uncomment to use)
    - name: Deploy to Heroku (optional)
      if: ${{ secrets.HEROKU_API_KEY != '' }}
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: your-email@example.com
