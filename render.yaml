# Render Blueprint for the Transmisi Eng backend.
#
# In Render: New → Blueprint → pick this repo. Render reads this file and
# creates the service; you then paste the secrets marked `sync: false`
# below. Full walkthrough in docs/DEPLOY_RENDER.md.
#
# The database is NOT declared here — we stay on the existing Neon
# Postgres, so nothing has to be migrated. Only DATABASE_URL points at it.

services:
  - type: web
    name: transmisi-api
    runtime: docker
    # Singapore is the closest region to Jakarta.
    region: singapore
    # Starter, not Free: the free plan sleeps after ~15 minutes idle, which
    # would stop the web-push sweeper and make the first request of the
    # morning wait on a cold start.
    plan: starter
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    numInstances: 1

    # No persistent disk on purpose. Attachments go to Cloudflare R2, which at
    # ~10 GB/year of growth is an order of magnitude cheaper per GB than a
    # Render disk, and — because nothing is stored on the instance — leaves
    # zero-downtime deploys and future scaling available. A disk would forbid
    # both. See docs/DEPLOY_RENDER.md if you would rather start on a disk.

    envVars:
      # Enables the prod safety check in app/main.py, which refuses to boot
      # on default secrets or a wildcard CORS origin.
      - key: APP_ENV
        value: prod

      # Attachments go to the R2 bucket rather than the container filesystem,
      # which has no persistence at all on Render without a disk.
      - key: STORAGE_BACKEND
        value: s3

      # R2 presents itself as one region.
      - key: S3_REGION
        value: auto

      # Paste in the dashboard, from Cloudflare:
      #   S3_ENDPOINT_URL      https://<account-id>.r2.cloudflarestorage.com
      #   S3_BUCKET            the bucket name
      #   S3_ACCESS_KEY_ID     R2 API token — Access Key ID
      #   S3_SECRET_ACCESS_KEY R2 API token — Secret Access Key
      # The secret is shown once at token creation and never again.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Generated once by Render and then held steady. Do not rotate this
      # casually — changing it invalidates every issued access and refresh
      # token, signing everyone out.
      - key: JWT_SECRET
        generateValue: true

      # Also checked by the prod safety gate — the service refuses to boot
      # while this is still "change-me-webhook", even though nothing in the
      # app reads it yet. Generated so the check passes cleanly.
      - key: N8N_WEBHOOK_SECRET
        generateValue: true

      # Paste in the dashboard. The Neon connection string, with the
      # postgresql+asyncpg:// scheme (NOT plain postgresql://).
      - key: DATABASE_URL
        sync: false

      # Paste in the dashboard. A JSON array, e.g.
      #   ["https://transmisisuplindo.com","https://www.transmisisuplindo.com"]
      # Pydantic parses this field as JSON, and APP_ENV=prod rejects ["*"].
      - key: CORS_ORIGINS
        sync: false

      # Optional — the AI features stay dark without it and everything else
      # works. Leave blank if you are not using them yet.
      - key: OPENAI_API_KEY
        sync: false
