[project]
name = "industriacrm-api"
version = "0.1.0"
description = "Enterprise CRM + ERP + AI for project-based industrial engineering"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
