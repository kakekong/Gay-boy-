version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ../backend
    env_file: [../.env]
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_started }
    ports: ["8000:8000"]
    volumes: ["../backend:/app", "storage:/data/storage"]

  worker:
    build: ../backend
    command: celery -A app.workers.celery_app:celery worker --loglevel=info
    env_file: [../.env]
    depends_on: [api]
    volumes: ["../backend:/app"]

  beat:
    build: ../backend
    command: celery -A app.workers.celery_app:celery beat --loglevel=info
    env_file: [../.env]
    depends_on: [api]
    volumes: ["../backend:/app"]

  frontend:
    build: ../frontend
    ports: ["5173:80"]
    depends_on: [api]

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      INDUSTRIA_API_URL: http://api:8000
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      WA_PHONE_ID: ${WA_PHONE_ID}
    volumes: ["n8ndata:/home/node/.n8n", "../n8n/workflows:/workflows:ro"]

volumes:
  pgdata:
  n8ndata:
  storage:
